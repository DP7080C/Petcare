<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PetCare — Información verificada para mascotas</title>
<style>
:root{
  --ink:#183b4b; --muted:#6b7d86; --bg:#f4fafb; --card:#fff; --line:#dcecef;
  --primary:#1aa59a; --primary-dark:#087d78; --green:#15966f; --green-bg:#e8f8f0;
  --blue:#367fc4; --blue-bg:#edf5ff; --orange:#e79a34; --orange-bg:#fff5e7;
  --shadow:0 12px 35px rgba(24,59,75,.08); --radius:20px;
}
*{box-sizing:border-box} body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--ink)}
button,input{font:inherit} button{cursor:pointer;border:0}
.header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav{max-width:1180px;margin:auto;padding:14px 22px;display:flex;align-items:center;gap:28px}
.logo{font-weight:900;font-size:22px;display:flex;align-items:center;gap:8px}.logo span{font-size:25px}
.navlinks{display:flex;gap:8px;flex:1}.navlinks button,.profileBtn{background:transparent;color:var(--ink);padding:10px 12px;border-radius:12px}.navlinks button:hover,.profileBtn:hover{background:#edf8f7}
.navlinks button.active{color:var(--primary-dark);background:#e9f8f6;font-weight:700}
.profileBtn{font-size:20px}.container{max-width:1180px;margin:auto;padding:30px 22px 60px}
.hero{background:linear-gradient(135deg,#eaf9fb,#f5fffc);border:1px solid var(--line);border-radius:28px;padding:42px;display:grid;grid-template-columns:1.25fr .75fr;gap:30px;box-shadow:var(--shadow)}
.badge{display:inline-flex;gap:7px;align-items:center;padding:7px 11px;border-radius:999px;font-size:12px;font-weight:800}.verified{background:var(--green-bg);color:var(--green)}.community{background:var(--blue-bg);color:var(--blue)}
h1{font-size:46px;line-height:1.03;margin:18px 0 15px}.lead{font-size:18px;color:var(--muted);max-width:620px;line-height:1.6}
.searchBox{margin-top:26px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:8px;display:flex;box-shadow:0 8px 25px rgba(24,59,75,.06)}.searchBox input{border:0;outline:0;flex:1;padding:14px;background:transparent;color:var(--ink)}.searchBox button,.primary{background:var(--primary);color:#fff;padding:13px 19px;border-radius:13px;font-weight:800}.searchBox button:hover,.primary:hover{background:var(--primary-dark)}
.tofiIntro{display:flex;align-items:center;gap:15px;background:#fff;padding:17px;border-radius:18px;margin-top:18px;border:1px solid var(--line)}.tofiAvatar{width:58px;height:58px;border-radius:18px;background:#dff6f3;display:grid;place-items:center;font-size:31px}
.heroArt{display:flex;align-items:center;justify-content:center;font-size:130px;min-height:270px}
.sectionTitle{display:flex;align-items:end;justify-content:space-between;margin:38px 0 17px}.sectionTitle h2{margin:0;font-size:27px}.muted{color:var(--muted)}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.category{background:#fff;border:1px solid var(--line);padding:23px;border-radius:18px;box-shadow:var(--shadow);transition:.2s}.category:hover,.articleCard:hover{transform:translateY(-2px)}.catIcon{font-size:35px}.category h3{margin:12px 0 5px}.category p{margin:0;color:var(--muted);font-size:14px}
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.articleCard{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;display:flex;gap:18px;transition:.2s}.articleThumb{width:100px;height:90px;border-radius:15px;display:grid;place-items:center;font-size:44px;background:#edf9f7}.articleCard h3{margin:8px 0}.articleCard p{color:var(--muted);line-height:1.5;margin:0 0 12px;font-size:14px}
.smallBtn{background:#edf8f7;color:var(--primary-dark);padding:9px 12px;border-radius:10px;font-weight:700}.smallBtn:hover{background:#d8f1ee}
.pageHead{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:22px}.pageHead h1{font-size:36px;margin:0}.filters{display:flex;gap:8px;flex-wrap:wrap}.filter{background:#fff;border:1px solid var(--line);padding:9px 12px;border-radius:10px;color:var(--muted)}.filter.active{background:#e8f8f0;color:var(--green);font-weight:800}
.articleDetail{background:#fff;border:1px solid var(--line);border-radius:24px;padding:32px;box-shadow:var(--shadow)}.articleDetail h1{font-size:40px;margin:15px 0}.meta{color:var(--muted);font-size:14px}.articleDetail p,.articleDetail li{line-height:1.75;color:#425b65}.sourceBox{margin-top:25px;background:#f7fbfc;border:1px solid var(--line);padding:18px;border-radius:16px}.warning{background:#fff8e9;border:1px solid #f4d59a;padding:15px;border-radius:14px;color:#765516}
.tofiLayout{display:grid;grid-template-columns:300px 1fr;gap:18px}.tofiSide,.chat{background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow)}.tofiSide{padding:22px}.tofiSide h2{margin-top:10px}.rule{padding:12px;border-radius:13px;background:#edf8f7;margin:10px 0;font-size:13px;line-height:1.45}.chat{display:flex;flex-direction:column;min-height:600px}.chatHead{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}.messages{padding:24px;flex:1;overflow:auto;background:#fbfefe}.msg{max-width:76%;padding:14px 16px;border-radius:18px;margin:0 0 15px;line-height:1.55}.msg.user{margin-left:auto;background:#e7f5ff}.msg.bot{background:#fff;border:1px solid var(--line)}.articleRef{border:1px solid #bfe6d4;background:#f2fbf6;border-radius:15px;padding:13px;margin-top:12px}.chatInput{padding:13px;border-top:1px solid var(--line);display:flex;gap:8px}.chatInput input{flex:1;border:1px solid var(--line);border-radius:12px;padding:13px;outline:none}.chatInput button{background:var(--primary);color:#fff;border-radius:12px;padding:0 18px}
.communityGrid{display:grid;grid-template-columns:1.4fr .6fr;gap:18px}.feed,.sideCard{background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}.post{padding:20px;border-bottom:1px solid var(--line)}.post:last-child{border-bottom:0}.userRow{display:flex;align-items:center;gap:12px}.avatar{width:45px;height:45px;border-radius:50%;display:grid;place-items:center;background:#eaf7f5;font-size:23px}.post p{line-height:1.65}.actions{display:flex;gap:14px;color:var(--muted);font-size:14px}.comment{margin-top:13px;margin-left:45px;background:#f6fafb;padding:11px;border-radius:12px;font-size:13px}.sideCard{padding:20px}.pet{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}.pet:last-child{border-bottom:0}
.profile{background:#fff;border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:var(--shadow)}.cover{height:170px;background:linear-gradient(135deg,#dff6f3,#edf7ff);display:flex;align-items:end;padding:22px;font-size:72px}.profileMain{padding:0 25px 25px}.profileAvatar{margin-top:-42px;width:90px;height:90px;border-radius:50%;background:#fff;border:5px solid #fff;box-shadow:var(--shadow);display:grid;place-items:center;font-size:48px}.stats{display:flex;gap:28px;margin:18px 0}.stats strong{display:block}.stats span{font-size:12px;color:var(--muted)}
.login{max-width:460px;margin:40px auto;background:#fff;padding:30px;border-radius:22px;border:1px solid var(--line);box-shadow:var(--shadow)}.field{display:block;margin:14px 0}.field span{display:block;font-size:13px;font-weight:700;margin-bottom:6px}.field input{width:100%;padding:12px;border:1px solid var(--line);border-radius:11px;outline:none}.demoNote{background:#f7fbfc;padding:13px;border-radius:12px;color:var(--muted);font-size:13px;margin:15px 0}
.empty{padding:45px;text-align:center;color:var(--muted);background:#fff;border:1px dashed var(--line);border-radius:18px}
.footer{border-top:1px solid var(--line);padding:25px;text-align:center;color:var(--muted);font-size:13px}
.toast{position:fixed;right:22px;bottom:22px;background:#183b4b;color:#fff;padding:14px 18px;border-radius:13px;box-shadow:var(--shadow);z-index:50;opacity:0;transform:translateY(10px);transition:.25s}.toast.show{opacity:1;transform:translateY(0)}
@media(max-width:850px){.hero,.tofiLayout,.communityGrid{grid-template-columns:1fr}.grid4{grid-template-columns:repeat(2,1fr)}.cards{grid-template-columns:1fr}.navlinks{display:none}h1{font-size:37px}.heroArt{min-height:130px;font-size:90px}}
@media(max-width:520px){.grid4{grid-template-columns:1fr}.container{padding:20px 14px 45px}.hero{padding:25px}.pageHead{align-items:flex-start;flex-direction:column}.articleDetail{padding:20px}}
</style>
</head>
<body>
<header class="header">
  <nav class="nav">
    <div class="logo"><span>🐾</span> PetCare</div>
    <div class="navlinks">
      <button data-route="home">Inicio</button>
      <button data-route="articles">Artículos</button>
      <button data-route="community">Comunidad</button>
      <button data-route="tofi">Tofi</button>
    </div>
    <button class="profileBtn" data-route="profile" title="Mi perfil">👤</button>
  </nav>
</header>

<main id="app" class="container"></main>
<footer class="footer">🐾 PetCare · Información verificada + experiencias de comunidad · Prototipo académico</footer>
<div id="toast" class="toast"></div>

<script>
const articles = [
{id:1,cat:"Alimentación",icon:"🥩",title:"Alimentos peligrosos para perros",date:"15/09/2026",tags:["perro","chocolate","uvas","cebolla","ajo","xilitol"],source:"Merck Veterinary Manual; guías veterinarias de nutrición",summary:"Algunos alimentos comunes pueden representar un riesgo para los perros y requieren especial precaución."},
{id:2,cat:"Alimentación",icon:"🍽️",title:"Alimentación básica de perros",date:"14/09/2026",tags:["perro","comida","nutrición"],source:"Guías veterinarias de nutrición",summary:"Principios generales para ofrecer una alimentación equilibrada y adecuada a la etapa de vida."},
{id:3,cat:"Alimentación",icon:"🐱",title:"Alimentos peligrosos para gatos",date:"13/09/2026",tags:["gato","alimentos","tóxicos"],source:"Merck Veterinary Manual; guías veterinarias",summary:"Algunos alimentos y sustancias pueden ser perjudiciales para los gatos."},
{id:4,cat:"Alimentación",icon:"🐈",title:"Alimentación básica de gatos",date:"12/09/2026",tags:["gato","nutrición","comida"],source:"Guías veterinarias de nutrición",summary:"Aspectos básicos de nutrición y alimentación responsable en gatos."},
{id:5,cat:"Alimentación",icon:"⚖️",title:"Obesidad en mascotas",date:"11/09/2026",tags:["peso","obesidad","perro","gato"],source:"AAHA; guías veterinarias de control de peso",summary:"Por qué el control del peso forma parte del cuidado preventivo de perros y gatos."},
{id:6,cat:"Salud",icon:"💉",title:"Vacunación preventiva en mascotas",date:"10/09/2026",tags:["vacunas","prevención","perro","gato"],source:"AAHA; recomendaciones veterinarias",summary:"La vacunación forma parte de la medicina preventiva y debe individualizarse con un profesional."},
{id:7,cat:"Salud",icon:"🪱",title:"Desparasitación",date:"09/09/2026",tags:["parásitos","prevención","desparasitación"],source:"Guías veterinarias de prevención",summary:"La prevención de parásitos depende de la mascota, su entorno y la evaluación veterinaria."},
{id:8,cat:"Salud",icon:"🚨",title:"Signos de alerta",date:"08/09/2026",tags:["emergencia","síntomas","alerta"],source:"Merck Veterinary Manual; recursos veterinarios",summary:"Señales generales que justifican buscar atención veterinaria con prontitud."},
{id:9,cat:"Salud",icon:"🦷",title:"Salud dental de perros y gatos",date:"07/09/2026",tags:["dientes","higiene","boca"],source:"AAHA; recursos de salud dental veterinaria",summary:"La higiene oral es una parte importante del cuidado preventivo."},
{id:10,cat:"Salud",icon:"🩺",title:"Visitas veterinarias preventivas",date:"06/09/2026",tags:["veterinario","prevención","controles"],source:"AAHA; recursos veterinarios",summary:"Los controles periódicos ayudan a detectar problemas y mantener un plan preventivo."},
{id:11,cat:"Higiene",icon:"🛁",title:"Baño y cuidado del pelaje",date:"05/09/2026",tags:["baño","pelaje","higiene"],source:"Recursos veterinarios de cuidado de mascotas",summary:"Buenas prácticas de higiene adaptadas a las necesidades de cada mascota."},
{id:12,cat:"Higiene",icon:"🪥",title:"Higiene dental en casa",date:"04/09/2026",tags:["dientes","cepillado","higiene"],source:"Recursos veterinarios de salud dental",summary:"La higiene dental en casa puede complementar la atención profesional."},
{id:13,cat:"Higiene",icon:"👂",title:"Limpieza y cuidado de oídos",date:"03/09/2026",tags:["oídos","limpieza","perro","gato"],source:"Recursos veterinarios de cuidado preventivo",summary:"El cuidado de los oídos debe hacerse de forma apropiada y sin introducir objetos."},
{id:14,cat:"Higiene",icon:"🐾",title:"Cuidado de uñas",date:"02/09/2026",tags:["uñas","patas","higiene"],source:"Recursos veterinarios de cuidado de mascotas",summary:"Mantener las uñas con una longitud adecuada contribuye al bienestar y movilidad."},
{id:15,cat:"Higiene",icon:"🧼",title:"Higiene general del gato",date:"01/09/2026",tags:["gato","higiene","pelaje"],source:"Recursos veterinarios de cuidado felino",summary:"Rutinas básicas de higiene y observación para gatos."},
{id:16,cat:"Comportamiento",icon:"😟",title:"Ansiedad en mascotas",date:"31/08/2026",tags:["ansiedad","estrés","conducta"],source:"Recursos veterinarios de comportamiento",summary:"La ansiedad puede manifestarse de distintas formas y merece una evaluación adecuada."},
{id:17,cat:"Comportamiento",icon:"🤝",title:"Socialización",date:"30/08/2026",tags:["socialización","perro","gato","conducta"],source:"Recursos veterinarios de comportamiento",summary:"La socialización responsable favorece una adaptación positiva a personas y entornos."},
{id:18,cat:"Comportamiento",icon:"🧘",title:"Estrés y bienestar",date:"29/08/2026",tags:["estrés","bienestar","conducta"],source:"Recursos veterinarios de comportamiento",summary:"Identificar factores de estrés ayuda a mejorar el entorno y bienestar de la mascota."},
{id:19,cat:"Comportamiento",icon:"🏃",title:"Ejercicio y bienestar en perros",date:"28/08/2026",tags:["ejercicio","perro","actividad"],source:"AAHA; recursos veterinarios",summary:"La actividad física debe adaptarse a la edad, condición y características de cada perro."},
{id:20,cat:"Comportamiento",icon:"🐕",title:"Comportamiento básico",date:"27/08/2026",tags:["conducta","entrenamiento","perro"],source:"Recursos veterinarios de comportamiento",summary:"Principios generales para comprender y acompañar conductas comunes."}
];

const users=[
{name:"María López",pet:"Luna · Golden Retriever · 4 años",emoji:"👩🏻",petEmoji:"🐶",text:"En nuestro caso, el cambio de alimentación lo hicimos progresivamente y fue muy bien.",likes:12,replies:["Carlos: A Max también le ayudó hacer los cambios poco a poco."]},
{name:"Carlos Ríos",pet:"Max · Mestizo · 2 años",emoji:"👨🏻",petEmoji:"🐕",text:"Mi perro ama el ejercicio; lo llevamos al parque varias veces por semana y notamos que está más activo.",likes:8,replies:["Andrea: Qué bueno, siempre adaptando la actividad a su energía."]},
{name:"Andrea Torres",pet:"Milo · Gato doméstico · 3 años",emoji:"👩🏻‍🦰",petEmoji:"🐱",text:"A Milo le encanta su rascador. Lo usamos todos los días y definitivamente ayuda con su comportamiento.",likes:15,replies:["María: Los rascadores también nos funcionan mucho."]}
];

let route="home", selectedArticle=null, category="Todas", logged=false;
const app=document.getElementById("app");

function toast(t){const x=document.getElementById("toast");x.textContent=t;x.classList.add("show");setTimeout(()=>x.classList.remove("show"),2200)}
function go(r,id=null){route=r;selectedArticle=id;window.scrollTo(0,0);render()}
document.addEventListener("click",e=>{
 const b=e.target.closest("[data-route]"); if(b) go(b.dataset.route);
 const a=e.target.closest("[data-article]"); if(a) go("article",Number(a.dataset.article));
 const c=e.target.closest("[data-cat]"); if(c){category=c.dataset.cat;go("articles")}
});
function articleCard(a){
 return `<article class="articleCard"><div class="articleThumb">${a.icon}</div><div style="flex:1"><span class="badge verified">✓ Información verificada</span><h3>${a.title}</h3><p>${a.summary}</p><div class="meta">📅 Revisado: ${a.date} · ${a.cat}</div><button class="smallBtn" data-article="${a.id}" style="margin-top:11px">Leer artículo →</button></div></article>`;
}
function home(){
return `<section class="hero">
<div><span class="badge verified">🟢 Biblioteca verificada · 20 artículos</span><h1>Cuidar mejor empieza con información confiable.</h1><p class="lead">PetCare reúne información verificada sobre el cuidado de mascotas y la hace fácil de consultar con Tofi, nuestro bibliotecario inteligente.</p>
<div class="searchBox"><input id="homeSearch" placeholder="Pregúntale a Tofi... por ejemplo: ¿qué alimentos no puede comer mi perro?"><button onclick="askHome()">Buscar</button></div>
<div class="tofiIntro"><div class="tofiAvatar">🐾</div><div><b>Hola, soy Tofi</b><br><span class="muted">Consulto exclusivamente los 20 artículos verificados de PetCare.</span></div></div></div>
<div class="heroArt">🐶<br>🐱</div></section>
<div class="sectionTitle"><h2>Explora por categoría</h2></div>
<div class="grid4">${[
["🥩","Alimentación",5],["💉","Salud",5],["🧼","Higiene",5],["🐾","Comportamiento",5]].map(x=>`<button class="category" data-cat="${x[1]}" style="text-align:left"><div class="catIcon">${x[0]}</div><h3>${x[1]}</h3><p>${x[2]} artículos verificados</p></button>`).join("")}</div>
<div class="sectionTitle"><h2>Artículos destacados</h2><button class="smallBtn" data-route="articles">Ver los 20 →</button></div>
<div class="cards">${articles.slice(0,4).map(articleCard).join("")}</div>
<div class="sectionTitle"><h2>La regla de oro de PetCare</h2></div>
<div class="articleDetail"><div class="grid4" style="grid-template-columns:1fr 1fr"><div><span class="badge verified">✓ Tofi SÍ puede</span><p>Buscar exclusivamente dentro de los 20 artículos, relacionar preguntas con contenidos y citar el artículo utilizado.</p></div><div><span class="badge" style="background:#fff0f0;color:#c04444">✕ Tofi NO puede</span><p>Usar internet, inventar información, utilizar respuestas de la comunidad como fuente o dar recomendaciones médicas personalizadas.</p></div></div></div>`;
}
function articlesPage(){
const list=category==="Todas"?articles:articles.filter(a=>a.cat===category);
return `<div class="pageHead"><div><h1>Artículos verificados</h1><p class="muted">Nuestra biblioteca cerrada de 20 artículos.</p></div><div class="filters">${["Todas","Alimentación","Salud","Higiene","Comportamiento"].map(c=>`<button class="filter ${category===c?"active":""}" data-cat="${c}">${c}</button>`).join("")}</div></div><div class="cards">${list.map(articleCard).join("")}</div>`;
}
function articlePage(){
const a=articles.find(x=>x.id===selectedArticle)||articles[0];
return `<button class="smallBtn" data-route="articles">← Volver a artículos</button><div class="articleDetail" style="margin-top:16px"><span class="badge verified">🟢 INFORMACIÓN VERIFICADA</span><h1>${a.icon} ${a.title}</h1><div class="meta">Última revisión: ${a.date} · Categoría: ${a.cat}</div><hr style="border:0;border-top:1px solid var(--line);margin:25px 0">
<h2>¿Qué debemos saber?</h2><p>${a.summary} Esta ficha presenta información general para orientar al propietario y facilitar una conversación informada con un profesional veterinario.</p>
<h2>Aspectos importantes</h2><ul><li>Las necesidades cambian según especie, edad, tamaño y condición individual.</li><li>Ante signos graves o una posible emergencia, la evaluación veterinaria es prioritaria.</li><li>La información de esta ficha no sustituye una consulta veterinaria.</li></ul>
<div class="warning">⚠️ <b>Importante:</b> si tu mascota presenta una situación urgente o has ingerido una sustancia potencialmente peligrosa, busca atención veterinaria.</div>
<div class="sourceBox"><b>📚 Fuentes consultadas</b><p>${a.source}</p><b>🔎 Palabras clave</b><p>${a.tags.join(" · ")}</p></div>
<h2 style="margin-top:35px">💬 Experiencias de la comunidad</h2><div class="badge community">🔵 Experiencia de usuario</div><p class="muted">Estas publicaciones son experiencias personales. No son información verificada y Tofi no las utiliza como fuente.</p>
${users.slice(0,2).map(u=>`<div class="post" style="border:1px solid var(--line);border-radius:15px;margin-top:10px"><div class="userRow"><div class="avatar">${u.emoji}</div><div><b>${u.name}</b><div class="meta">${u.pet}</div></div></div><p>${u.text}</p><div class="actions">♡ ${u.likes} · 💬 ${u.replies.length}</div></div>`).join("")}</div>`;
}
function tofiPage(){
return `<div class="pageHead"><div><h1>🐾 Tofi</h1><p class="muted">Tu bibliotecario inteligente de cuidados para mascotas.</p></div><span class="badge verified">🟢 Solo 20 artículos</span></div>
<div class="tofiLayout"><aside class="tofiSide"><div class="tofiAvatar">🐾</div><h2>Regla de oro</h2><div class="rule">✓ Solo utiliza los 20 artículos verificados.</div><div class="rule">✓ Muestra el artículo utilizado.</div><div class="rule">✓ Si no hay información suficiente, lo dice.</div><div class="rule" style="background:#fff4f4;color:#a33">✕ No usa respuestas de la comunidad.</div><div class="rule" style="background:#fff4f4;color:#a33">✕ No consulta internet.</div></aside>
<section class="chat"><div class="chatHead"><div class="avatar">🐾</div><div><b>Tofi</b><div class="meta">Biblioteca PetCare · 20 artículos</div></div></div><div id="messages" class="messages"><div class="msg bot"><b>Hola, soy Tofi 👋</b><br>Pregúntame algo sobre el cuidado de mascotas. Solo responderé con información que exista en la biblioteca verificada de PetCare.</div><div class="msg bot"><b>Prueba:</b> “¿Qué alimentos no puede comer mi perro?” o pregunta por un tema que no esté en los 20 artículos para ver cómo Tofi se abstiene de responder.</div></div><div class="chatInput"><input id="tofiInput" placeholder="Escribe tu pregunta..."><button onclick="askTofi()">➤</button></div></section></div>`;
}
function communityPage(){
return `<div class="pageHead"><div><h1>Comunidad</h1><p class="muted">Comparte experiencias y conoce a otros amantes de las mascotas.</p></div><span class="badge community">🔵 Experiencias de usuarios</span></div>
<div class="communityGrid"><section class="feed">${users.map((u,i)=>`<div class="post"><div class="userRow"><div class="avatar">${u.emoji}</div><div><b>${u.name}</b><div class="meta">${u.pet}</div></div></div><p>${u.text}</p><div class="actions"><button onclick="likePost(this)">♡ ${u.likes}</button><button onclick="toast('Respuesta de demostración abierta')">💬 ${u.replies.length} respuestas</button><button onclick="toast('Perfil de demostración')">👤 Ver perfil</button></div><div class="comment"><b>Respuesta:</b> ${u.replies[0]}</div></div>`).join("")}</section>
<aside class="sideCard"><h3>🐾 Mascotas de la comunidad</h3>${users.map(u=>`<div class="pet"><span style="font-size:28px">${u.petEmoji}</span><div><b>${u.pet.split(" · ")[0]}</b><div class="meta">${u.pet.split(" · ").slice(1).join(" · ")}</div></div></div>`).join("")}<hr style="border:0;border-top:1px solid var(--line);margin:20px 0"><p class="muted" style="font-size:13px">⚠️ Las experiencias no constituyen consejo veterinario y nunca alimentan las respuestas de Tofi.</p></aside></div>`;
}
function profilePage(){
return `<div class="profile"><div class="cover">🐶 🐱</div><div class="profileMain"><div class="profileAvatar">👩🏻</div><h1 style="font-size:30px;margin:12px 0 2px">Laura Gómez</h1><div class="meta">@lauragomez · Amante de las mascotas</div><div class="stats"><div><strong>12</strong><span>Seguidores</span></div><div><strong>8</strong><span>Siguiendo</span></div><div><strong>5</strong><span>Publicaciones</span></div></div><button class="primary" onclick="toast('Perfil actualizado (demo)')">Editar perfil</button><h2 style="margin-top:32px">Mis mascotas</h2><div class="pet"><span style="font-size:40px">🐶</span><div><b>Luna</b><div class="meta">Golden Retriever · 4 años</div></div></div><div class="pet"><span style="font-size:40px">🐱</span><div><b>Milo</b><div class="meta">Gato doméstico · 3 años</div></div></div></div></div>`;
}
function loginPage(){
return `<div class="login"><span class="badge verified">🐾 PetCare</span><h1 style="font-size:34px">Iniciar sesión</h1><p class="muted">En el prototipo, el acceso es simulado para mostrar el flujo de usuario.</p><label class="field"><span>Correo</span><input id="email" type="email" placeholder="usuario@ejemplo.com"></label><label class="field"><span>Contraseña</span><input id="pass" type="password" placeholder="••••••••"></label><button class="primary" style="width:100%" onclick="loginDemo()">Entrar</button><div class="demoNote">🔐 Versión demo: no se almacenan credenciales. La autenticación real se conectará en una fase posterior con una base de datos.</div></div>`;
}
function render(){
if(route==="home") app.innerHTML=home();
else if(route==="articles") app.innerHTML=articlesPage();
else if(route==="article") app.innerHTML=articlePage();
else if(route==="tofi") app.innerHTML=tofiPage();
else if(route==="community") app.innerHTML=communityPage();
else if(route==="profile") app.innerHTML=profilePage();
else if(route==="login") app.innerHTML=loginPage();
}
function findArticle(q){
q=q.toLowerCase();
return articles.map(a=>({a,score:[a.title,...a.tags,a.cat].join(" ").toLowerCase().split(" ").reduce((s,w)=>s+(q.includes(w)?1:0),0)})).sort((x,y)=>y.score-x.score).find(x=>x.score>0)?.a;
}
function answer(q){
const a=findArticle(q);
if(a)return `He encontrado información verificada relacionada con tu pregunta.<br><br>${a.summary}<div class="articleRef"><b>📚 Información utilizada</b><br><span class="badge verified" style="margin-top:8px">🟢 ${a.title}</span><div class="meta" style="margin-top:7px">Revisado: ${a.date}</div><button class="smallBtn" data-article="${a.id}" style="margin-top:9px">Leer artículo →</button></div><p class="meta" style="margin-top:10px">Tofi respondió exclusivamente usando este artículo de la biblioteca PetCare.</p>`;
return `Lo siento, actualmente nuestra biblioteca verificada de 20 artículos no contiene información suficiente para responder esa pregunta.<br><br>Para mantener la información de PetCare confiable, <b>no voy a utilizar conocimiento externo ni respuestas de la comunidad</b> para completar la respuesta.<div class="articleRef"><b>📚 Biblioteca disponible</b><br><span class="meta">20 artículos verificados en Alimentación, Salud, Higiene y Comportamiento.</span><br><button class="smallBtn" data-route="articles" style="margin-top:9px">Ver biblioteca →</button></div>`;
}
function askTofi(){
const input=document.getElementById("tofiInput"); if(!input||!input.value.trim())return;
const q=input.value.trim(), box=document.getElementById("messages");
box.innerHTML+=`<div class="msg user">${q}</div><div class="msg bot">${answer(q)}</div>`;
input.value="";box.scrollTop=box.scrollHeight;
}
function askHome(){const q=document.getElementById("homeSearch").value.trim(); if(!q){go("tofi");return} go("tofi"); setTimeout(()=>{const i=document.getElementById("tofiInput");i.value=q;askTofi()},0)}
function likePost(btn){let t=btn.textContent;let n=parseInt(t.match(/\d+/)?.[0]||0)+1;btn.textContent="♥ "+n;toast("¡Me gusta añadido!") }
function loginDemo(){logged=true;toast("Sesión de demostración iniciada");setTimeout(()=>go("profile"),400)}
render();
</script>
</body>
</html>
